name: Gerar gráfico 3D de contribuições

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-3d.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Gerar o gráfico 3D
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ./.github/profile-3d-settings.json

      - name: Salvar o gráfico atualizado
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib
          git diff --cached --quiet || git commit -m "Atualiza gráfico 3D de contribuições"
          git push
